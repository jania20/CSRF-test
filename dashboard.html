<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoSeguro - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="dashboard-page">
    <header class="header">
        <div class="logo-header">
            <span>🏦</span>
            <span>BancoSeguro</span>
        </div>
        <div class="header-right">
            <div class="greeting" id="greeting">Hola, Juan Confiado</div>
            <button class="logout-btn" id="logoutBtn">Cerrar Sesión</button>
        </div>
    </header>

    <div class="container">
        <div class="balance-card">
            <div class="account-title">Mi Cuenta Corriente</div>
            <div class="account-number">****4892</div>
            <div class="balance-amount" id="balanceAmount">$5,000.00</div>
            <div class="balance-currency">MXN</div>
        </div>

        <div class="transfer-section">
            <h2 class="section-title">Transferir</h2>
            <div class="alert-success" id="successAlert">Transferencia exitosa</div>
            
            <form id="transferForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Cantidad</label>
                        <input 
                            type="number" 
                            id="amount" 
                            name="amount" 
                            placeholder="0.00"
                            step="0.01"
                            min="0.01"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="destination">Cuenta destino</label>
                        <input 
                            type="text" 
                            id="destination" 
                            name="destination" 
                            placeholder="Ej: ****1234"
                            required
                        >
                    </div>
                </div>
                <button type="submit" class="transfer-btn">Transferir</button>
            </form>
        </div>

        <div class="transactions-section">
            <h2 class="section-title">Últimas 3 transacciones</h2>
            <ul class="transactions-list" id="transactionsList">
                <!-- Las transacciones se cargarán dinámicamente -->
            </ul>
        </div>
    </div>

    <script src="assets/js/dashboard.js"></script>
</body>
</html>
